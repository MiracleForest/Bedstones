format = 4
id = "github.com/MiracleForest/Bedstones"
version = "0.2.0-beta.1"

[info]
name = "Bedstones"
description = "Waystones for Minecraft Bedrock Edition: waystones, sharestones, warp plates, scrolls and the Waystones screens"
tags = ["teleport", "game-mechanics", "utility", "waystones"]
logo = "https://raw.githubusercontent.com/MiracleForest/Bedstones/main/docs/logo.png"

# Bedstones is compiled against one LeviLamina line at a time, so every supported line is a
# variant named after it: 26_51 for LeviLamina 26.51.x (Minecraft 1.26.51), 26_60 for 26.60.x
# (Minecraft 1.26.60). Variant names may only hold [a-z0-9_], hence 26_60 and not 26.60.
# Each line has a server entry (the dedicated server) and a client entry (LeviLauncher).
#
# The default variant is the newest line on both sides. There is no "client" variant: lip and
# LeviLauncher pick the server or the client entry of a variant by the side they install on.
#
# LeviLamina's releases are still tooth.json packages, whose client build is their "client"
# variant, so the client entries depend on github.com/LiteLDev/LeviLamina#client.

# --- 26.60 (Minecraft 1.26.60) ------------------------------------------------------------------

[[variants.""]]
side = "server"
platform = "win-x64"
preserve = ["mods/Bedstones/config/"]

[variants."".deps]
"github.com/LiteLDev/LeviLamina" = "26.60.*"

[[variants."".assets]]
type = "mcmod"
urls = ["https://{{id}}/releases/download/v{{version}}/bedstones-server-win-x64-ll26.60.zip"]

[[variants.""]]
side = "client"
platform = "win-x64"
preserve = ["mods/Bedstones/config/"]

[variants."".deps]
"github.com/LiteLDev/LeviLamina#client" = "26.60.*"

[[variants."".assets]]
type = "mcmod"
urls = ["https://{{id}}/releases/download/v{{version}}/bedstones-client-win-x64-ll26.60.zip"]

[[variants."26_60"]]
side = "server"
platform = "win-x64"
preserve = ["mods/Bedstones/config/"]

[variants."26_60".deps]
"github.com/LiteLDev/LeviLamina" = "26.60.*"

[[variants."26_60".assets]]
type = "mcmod"
urls = ["https://{{id}}/releases/download/v{{version}}/bedstones-server-win-x64-ll26.60.zip"]

[[variants."26_60"]]
side = "client"
platform = "win-x64"
preserve = ["mods/Bedstones/config/"]

[variants."26_60".deps]
"github.com/LiteLDev/LeviLamina#client" = "26.60.*"

[[variants."26_60".assets]]
type = "mcmod"
urls = ["https://{{id}}/releases/download/v{{version}}/bedstones-client-win-x64-ll26.60.zip"]

# --- 26.51 (Minecraft 1.26.51) ------------------------------------------------------------------

# A LeviLamina 26.51 server loads its mods from plugins/, not mods/ (LeviLamina 26.51 itself is
# in plugins/LeviLamina/), so this entry places the archive there instead of using mcmod, which
# always writes into mods/.
[[variants."26_51"]]
side = "server"
platform = "win-x64"
preserve = ["plugins/Bedstones/config/"]

[variants."26_51".deps]
"github.com/LiteLDev/LeviLamina" = "26.51.*"

[[variants."26_51".assets]]
type = "zip"
urls = ["https://{{id}}/releases/download/v{{version}}/bedstones-server-win-x64-ll26.51.zip"]
place = [{ src = "", dest = "plugins/Bedstones/" }]

[[variants."26_51"]]
side = "client"
platform = "win-x64"
preserve = ["mods/Bedstones/config/"]

[variants."26_51".deps]
"github.com/LiteLDev/LeviLamina#client" = "26.51.*"

[[variants."26_51".assets]]
type = "mcmod"
urls = ["https://{{id}}/releases/download/v{{version}}/bedstones-client-win-x64-ll26.51.zip"]
